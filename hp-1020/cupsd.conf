# --- 基础设置 ---
LogLevel warn

# 【新增】指定日志文件路径 (默认其实就是这里，但写出来更明确)
ErrorLog /var/log/cups/error.log
AccessLog /var/log/cups/access.log
PageLog /var/log/cups/page.log

# 【关键】限制单个日志文件大小为 5MB，防止无限增长撑爆存储
MaxLogSize 5m
# 保留最近的 1 个备份日志
MaxLogFiles 3

# 允许任何主机名访问
ServerAlias *
# ... (后面内容保持不变)

# --- 监听设置 ---
# 监听所有网络接口的 631 端口
Port 631
# 监听本地 Socket (供容器内命令使用)
Listen /run/cups/cups.sock

# --- 发现与共享 ---
# 开启网络共享
Browsing On
# 开启 AirPrint/Bonjour 广播
BrowseLocalProtocols dnssd
# 允许从任何地址接收浏览包
BrowseAddress @LOCAL

# --- 认证方式 ---
# 默认使用 Basic 认证 (网页弹窗输密码)
DefaultAuthType Basic
WebInterface Yes

# --- 访问控制 (谁能访问网页/服务) ---
# 允许所有人访问根目录和管理页面
# (在 Docker 局域网环境下，我们通常信任内网设备)
<Location />
  Order allow,deny
  Allow all
</Location>

<Location /admin>
  Order allow,deny
  Allow all
</Location>

# --- 权限策略 (谁能做什么操作) ---
<Policy default>
  # 1. 绝大多数操作 (打印、查看状态)：允许所有人，不需要密码
  <Limit All>
    Order deny,allow
    Allow all
  </Limit>

  # 2. 管理员操作 (添加/删除打印机)：需要认证
  # 这里定义了哪些操作算“管理操作”
  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
    Allow all
  </Limit>
</Policy>